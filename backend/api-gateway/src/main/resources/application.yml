server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: "${GATEWAY_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}"
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: ["*"]
            allow-credentials: true
            max-age: 3600
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates: [Path=/api/v1/auth/**]
        - id: admin-user-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates: [Path=/api/v1/admin/users/**]
        - id: admin-video-service
          uri: ${VIDEO_SERVICE_URL:http://localhost:8083}
          predicates: [Path=/api/v1/admin/videos/**]
        - id: admin-moderation-service
          uri: ${MODERATION_SERVICE_URL:http://localhost:8091}
          predicates: [Path=/api/v1/admin/reports/**]
        - id: user-creator-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - "Path=/api/v1/users/**,/api/v1/creators/**,/api/v1/channels/**,/api/v1/categories/**,/api/v1/genres/**,/api/v1/languages/**"
        - id: video-service
          uri: ${VIDEO_SERVICE_URL:http://localhost:8083}
          predicates: [Path=/api/v1/videos/**]
        - id: upload-service
          uri: ${UPLOAD_SERVICE_URL:http://localhost:8084}
          predicates: [Path=/api/v1/uploads/**]
        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8085}
          predicates: [Path=/api/v1/search/**]
        - id: engagement-service
          uri: ${ENGAGEMENT_SERVICE_URL:http://localhost:8086}
          predicates: [Path=/api/v1/engagement/**]
        - id: subscription-service
          uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8087}
          predicates: [Path=/api/v1/subscriptions/**]
        - id: playlist-service
          uri: ${PLAYLIST_SERVICE_URL:http://localhost:8088}
          predicates: [Path=/api/v1/playlists/**]
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
          predicates: [Path=/api/v1/notifications/**]
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8090}
          predicates: [Path=/api/v1/analytics/**]
        - id: moderation-service
          uri: ${MODERATION_SERVICE_URL:http://localhost:8091}
          predicates: [Path=/api/v1/moderation/**]
        - id: live-tv-service
          uri: ${LIVE_TV_SERVICE_URL:http://localhost:8092}
          predicates: [Path=/api/v1/live/**]

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
