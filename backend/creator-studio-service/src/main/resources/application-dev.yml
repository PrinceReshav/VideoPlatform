spring:
  config:
    activate:
      on-profile: dev
  application:
    name: creator-studio-service
  datasource:
    url: jdbc:h2:mem:creator_studio_service_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS creator_studio_schema
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: creator_studio_schema
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.platform: INFO

# Development-only test switches. These mocks must remain disabled in UAT and production.
creator-studio:
  registration:
    mock-enabled: true
  payments:
    mock-enabled: true
  kyc:
    mock-verified: true
