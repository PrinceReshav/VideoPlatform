
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: 'jdbc:h2:mem:engagement_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS auth_schema\;CREATE SCHEMA IF NOT EXISTS user_schema\;CREATE SCHEMA IF NOT EXISTS video_schema\;CREATE SCHEMA IF NOT EXISTS upload_schema\;CREATE SCHEMA IF NOT EXISTS engagement_schema\;CREATE SCHEMA IF NOT EXISTS subscription_schema\;CREATE SCHEMA IF NOT EXISTS playlist_schema\;CREATE SCHEMA IF NOT EXISTS notification_schema\;CREATE SCHEMA IF NOT EXISTS analytics_schema\;CREATE SCHEMA IF NOT EXISTS moderation_schema\;CREATE SCHEMA IF NOT EXISTS common_schema'
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        default_schema: engagement_schema
    open-in-view: false

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false

  data:
    redis:
      repositories:
        enabled: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.platform: INFO
