spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:tcp://localhost:9123/video-platform-dev;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS AUTH_SCHEMA\;CREATE SCHEMA IF NOT EXISTS USER_SCHEMA\;CREATE SCHEMA IF NOT EXISTS VIDEO_SCHEMA\;CREATE SCHEMA IF NOT EXISTS UPLOAD_SCHEMA\;CREATE SCHEMA IF NOT EXISTS ENGAGEMENT_SCHEMA\;CREATE SCHEMA IF NOT EXISTS SUBSCRIPTION_SCHEMA\;CREATE SCHEMA IF NOT EXISTS PLAYLIST_SCHEMA\;CREATE SCHEMA IF NOT EXISTS NOTIFICATION_SCHEMA\;CREATE SCHEMA IF NOT EXISTS ANALYTICS_SCHEMA\;CREATE SCHEMA IF NOT EXISTS MODERATION_SCHEMA
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        default_schema: subscription_schema
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.platform: INFO


