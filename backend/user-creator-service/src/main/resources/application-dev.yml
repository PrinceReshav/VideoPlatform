  spring:
    config:
      activate:
        on-profile: dev

    datasource:
      url: jdbc:h2:mem:user_creator_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS USER_SCHEMA
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1

    jpa:
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          format_sql: false
          show_sql: false
          default_schema: user_schema
      open-in-view: false

    flyway:
      enabled: false

    kafka:
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      listener:
        auto-startup: false

    data:
      redis:
        repositories:
          enabled: false

    cache:
      type: caffeine
      caffeine:
        spec: maximumSize=1000,expireAfterWrite=5m

    servlet:
      multipart:
        max-file-size: 10GB
        max-request-size: 10GB

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus,caches

    endpoint:
      health:
        show-details: always
        probes:
          enabled: true

    health:
      redis:
        enabled: false

  logging:
    level:
      com.platform: INFO
      org.hibernate.SQL: WARN