version: '3.8'

services:
  # PostgreSQL - Primary database with logical schemas per service
  postgres:
    image: postgres:16-alpine
    container_name: video-platform-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-video_platform}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-video_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Redis - Caching, sessions, rate limiting, upload state
  redis:
    image: redis:7-alpine
    container_name: video-platform-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./infrastructure/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Apache Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: video-platform-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: "video-platform-cluster"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infrastructure/docker/kafka/topics.json:/etc/kafka/topics.json:ro
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Kafka UI for development
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: video-platform-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: video-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
    ports:
      - "8095:8080"
    depends_on:
      - kafka
    networks:
      - platform-network

  # Elasticsearch - Search index
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: video-platform-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - indices.memory.index_buffer_size=30%
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./infrastructure/docker/elasticsearch/index-templates:/usr/share/elasticsearch/config/index-templates:ro
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G

  # MinIO - S3-compatible object storage
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-33Z
    container_name: video-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
      - ./infrastructure/docker/minio/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-07-33Z
    container_name: video-platform-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/videos;
      mc mb --ignore-existing local/thumbnails;
      mc mb --ignore-existing local/hls;
      mc mb --ignore-existing local/avatars;
      mc mb --ignore-existing local/banners;
      mc anonymous set public local/avatars;
      mc anonymous set public local/banners;
      mc anonymous set download local/videos;
      mc anonymous set download local/thumbnails;
      mc anonymous set download local/hls;
      echo 'MinIO buckets created and configured.';
      "
    networks:
      - platform-network

  # API Gateway - Spring Cloud Gateway
  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    container_name: video-platform-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      EUREKA_CLIENT_ENABLED: "false"
      SERVER_PORT: 8080
      CREATOR_STUDIO_SERVICE_URL: http://creator-studio-service:8094
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: auth-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/v1/auth/**
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: user-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://user-creator-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/v1/users/**,/api/v1/creators/**,/api/v1/channels/**
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: video-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://video-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/v1/videos/**
      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: upload-service
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://upload-service:8084
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/api/v1/uploads/**
      SPRING_CLOUD_GATEWAY_ROUTES_4_ID: search-service
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://search-service:8085
      SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: Path=/api/v1/search/**
      SPRING_CLOUD_GATEWAY_ROUTES_5_ID: engagement-service
      SPRING_CLOUD_GATEWAY_ROUTES_5_URI: http://engagement-service:8086
      SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0: Path=/api/v1/engagement/**
      SPRING_CLOUD_GATEWAY_ROUTES_6_ID: subscription-service
      SPRING_CLOUD_GATEWAY_ROUTES_6_URI: http://subscription-service:8087
      SPRING_CLOUD_GATEWAY_ROUTES_6_PREDICATES_0: Path=/api/v1/subscriptions/**
      SPRING_CLOUD_GATEWAY_ROUTES_7_ID: playlist-service
      SPRING_CLOUD_GATEWAY_ROUTES_7_URI: http://playlist-service:8088
      SPRING_CLOUD_GATEWAY_ROUTES_7_PREDICATES_0: Path=/api/v1/playlists/**
      SPRING_CLOUD_GATEWAY_ROUTES_8_ID: notification-service
      SPRING_CLOUD_GATEWAY_ROUTES_8_URI: http://notification-service:8089
      SPRING_CLOUD_GATEWAY_ROUTES_8_PREDICATES_0: Path=/api/v1/notifications/**
      SPRING_CLOUD_GATEWAY_ROUTES_9_ID: analytics-service
      SPRING_CLOUD_GATEWAY_ROUTES_9_URI: http://analytics-service:8090
      SPRING_CLOUD_GATEWAY_ROUTES_9_PREDICATES_0: Path=/api/v1/analytics/**
      SPRING_CLOUD_GATEWAY_ROUTES_10_ID: moderation-service
      SPRING_CLOUD_GATEWAY_ROUTES_10_URI: http://moderation-service:8091
      SPRING_CLOUD_GATEWAY_ROUTES_10_PREDICATES_0: Path=/api/v1/moderation/**
      SPRING_CLOUD_GATEWAY_ROUTES_11_ID: live-tv-service
      SPRING_CLOUD_GATEWAY_ROUTES_11_URI: http://live-tv-service:8092
      SPRING_CLOUD_GATEWAY_ROUTES_11_PREDICATES_0: Path=/api/v1/live/**
      # CORS
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_'[/**]'.ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8081,exp://localhost:8081"
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_'[/**]'.ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_'[/**]'.ALLOWED_HEADERS: "*"
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_'[/**]'.ALLOW_CREDENTIALS: "true"
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_'[/**]'.MAX_AGE: 3600
      # Rate limiting
      SPRING_CLOUD_GATEWAY_FILTER_REQUESTRATELIMITER_REDIS_RATELIMITER_REPLENISHRATE: 100
      SPRING_CLOUD_GATEWAY_FILTER_REQUESTRATELIMITER_REDIS_RATELIMITER_BURSTCAPACITY: 200
      # Observability
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: DEBUG
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Placeholder services - will be built in subsequent phases
  # These are defined here so the network exists, but they won't start until built
  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    container_name: video-platform-auth
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_platform?currentSchema=auth_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-platform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production_min_256_bits}
      JWT_ACCESS_TOKEN_EXPIRY_MS: 900000
      JWT_REFRESH_TOKEN_EXPIRY_MS: 2592000000
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8081
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  user-creator-service:
    build:
      context: .
      dockerfile: backend/user-creator-service/Dockerfile
    container_name: video-platform-user
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_platform?currentSchema=user_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-platform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_AVATARS: avatars
      MINIO_BUCKET_BANNERS: banners
      SERVER_PORT: 8082
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  video-service:
    build:
      context: .
      dockerfile: backend/video-service/Dockerfile
    container_name: video-platform-video
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_platform?currentSchema=video_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-platform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_VIDEOS: videos
      MINIO_BUCKET_HLS: hls
      MINIO_BUCKET_THUMBNAILS: thumbnails
      SERVER_PORT: 8083
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    ports:
      - "8083:8083"
    depends_on:
      user-creator-service:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  upload-service:
    build:
      context: .
      dockerfile: backend/upload-service/Dockerfile
    container_name: video-platform-upload
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_platform?currentSchema=upload_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-platform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_VIDEOS: videos
      UPLOAD_CHUNK_SIZE_MB: 256
      UPLOAD_MAX_FILE_SIZE_GB: 50
      SERVER_PORT: 8084
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    ports:
      - "8084:8084"
    depends_on:
      user-creator-service:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  transcoding-service:
    build:
      context: .
      dockerfile: backend/transcoding-service/Dockerfile
    container_name: video-platform-transcoding
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_VIDEOS: videos
      MINIO_BUCKET_HLS: hls
      MINIO_BUCKET_THUMBNAILS: thumbnails
      VIDEO_SERVICE_URL: http://video-service:8083
      FFMPEG_THREADS: 2
      TRANSCODING_TEMP_DIR: /tmp/transcoding
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    volumes:
      - transcoding_temp:/tmp/transcoding
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      video-service:
        condition: service_started
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  search-service:
    build:
      context: .
      dockerfile: backend/search-service/Dockerfile
    container_name: video-platform-search
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_ELASTICSEARCH_INDEX_VIDEOS: videos_v1
      SERVER_PORT: 8085
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    ports:
      - "8085:8085"
    depends_on:
      video-service:
        condition: service_started
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  engagement-service:
    build:
      context: .
      dockerfile: backend/engagement-service/Dockerfile
    container_name: video-platform-engagement
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_platform?currentSchema=engagement_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-platform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8086
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    ports:
      - "8086:8086"
    depends_on:
      video-service:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  subscription-service:
    build:
      context: .
      dockerfile: backend/subscription-service/Dockerfile
    container_name: video-platform-subscription
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_platform?currentSchema=subscription_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-platform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8087
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    ports:
      - "8087:8087"
    depends_on:
      user-creator-service:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  playlist-service:
    build:
      context: .
      dockerfile: backend/playlist-service/Dockerfile
    container_name: video-platform-playlist
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video_platform?currentSchema=playlist_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-platform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_password}
