# Redis configuration for video-platform
# Optimized for caching, sessions, rate limiting, and upload state

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Performance
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Client limits
maxclients 10000

# Logging
loglevel notice
logfile ""

# Databases
databases 16

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# Replication (disabled for single-node dev)
# replicaof no one

# Security (enable in production)
# requirepass your_strong_password
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""

# Modules (none for MVP)
# loadmodule /path/to/module.so