apiVersion: v1
kind: ConfigMap
metadata:
  name: video-platform-config
  namespace: video-platform-prod
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
  SPRING_REDIS_HOST: "redis-cluster"
  SPRING_REDIS_PORT: "6379"
  ELASTICSEARCH_HOST: "https://elasticsearch.yourdomain.com"
  MINIO_ENDPOINT: "https://minio.yourdomain.com"
  JWT_ACCESS_TOKEN_EXPIRY_MS: "900000"
  JWT_REFRESH_TOKEN_EXPIRY_MS: "2592000000"
  UPLOAD_CHUNK_SIZE_MB: "256"
  UPLOAD_MAX_FILE_SIZE_GB: "50"
  FFMPEG_THREADS: "4"
  TRANSCODING_HLS_SEGMENT_DURATION: "6"
  GATEWAY_RATE_LIMIT_REPLENISH_RATE: "1000"
  GATEWAY_RATE_LIMIT_BURST_CAPACITY: "2000"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  USER_SERVICE_URL: "http://user-creator-service:8082"
  VIDEO_SERVICE_URL: "http://video-service:8083"
  UPLOAD_SERVICE_URL: "http://upload-service:8084"
  SEARCH_SERVICE_URL: "http://search-service:8085"
  ENGAGEMENT_SERVICE_URL: "http://engagement-service:8086"
  SUBSCRIPTION_SERVICE_URL: "http://subscription-service:8087"
  PLAYLIST_SERVICE_URL: "http://playlist-service:8088"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8089"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8090"
  MODERATION_SERVICE_URL: "http://moderation-service:8091"
  LIVE_TV_SERVICE_URL: "http://live-tv-service:8092"
---

apiVersion: v1
kind: Secret
metadata:
  name: video-platform-secrets
  namespace: video-platform-prod
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_AT_DEPLOYMENT"
  POSTGRES_PASSWORD: "REPLACE_AT_DEPLOYMENT"
  POSTGRES_DB: "REPLACE_AT_DEPLOYMENT"
  JWT_SECRET: "REPLACE_AT_DEPLOYMENT"
  REDIS_PASSWORD: "REPLACE_AT_DEPLOYMENT"
  MINIO_ROOT_USER: "REPLACE_AT_DEPLOYMENT"
  MINIO_ROOT_PASSWORD: "REPLACE_AT_DEPLOYMENT"
  ELASTICSEARCH_PASSWORD: "REPLACE_AT_DEPLOYMENT"
  SMTP_PASSWORD: "REPLACE_AT_DEPLOYMENT"
  ADMIN_PASSWORD: "REPLACE_AT_DEPLOYMENT"