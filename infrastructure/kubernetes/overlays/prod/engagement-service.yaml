apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement-service
  namespace: video-platform-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: engagement-service
  template:
    metadata:
      labels:
        app: engagement-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
    spec:
      containers:
      - name: engagement-service
        image: ${REGISTRY}/${IMAGE_NAME}-engagement-service:latest
        ports:
        - containerPort: 8086
        envFrom:
        - configMapRef:
            name: video-platform-config
        - secretRef:
            name: video-platform-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8086
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: engagement-service
  namespace: video-platform-prod
spec:
  selector:
    app: engagement-service
  ports:
  - port: 8086
    targetPort: 8086
  type: ClusterIP